name: "Tests"

on:
  push:
    paths:
      - ".github/**/*"
      - "jumeaux/*"
      - "jumeaux/**/*"
      - "tests/*"
      - "tests/**/*"
      - "e2e/*"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - "mise.toml"
      - ".python-version"
  schedule:
    - cron: "0 0 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    name: Python ${{ matrix.python }}
    env:
      # .python-versionではなくmatrixのPythonで動かす
      UV_PYTHON: ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          # ランナーのキャッシュが古いときに、脆弱性を修正したパッチへ追従する
          check-latest: true
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.24
          install_args: uv

      - name: Install dependencies
        run: uv sync

      - run: make ci
        env:
          TZ: "Asia/Tokyo"
