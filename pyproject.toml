[project]
authors = [
    {name = "tadashi-aikawa", email = "syou.maman@gmail.com"},
]
license = {text = "MIT"}
requires-python = "<4.0.0,>=3.10.0"
dependencies = [
    "requests<3.0.0,>=2.22.0",
    "docopt<1.0.0,>=0.6.2",
    "schema<1.0.0,>=0.7.1",
    "xmltodict<1.0.0,>=0.12.0",
    "boto3<2.0.0,>=1.10.28",
    "pydash<7.0.0,>=4.7.6",
    "beautifulsoup4<5.0.0,>=4.8.1",
    "lxml>=5.3.0,<7.0.0",
    "livereload<3.0.0,>=2.6.1",
    "tzlocal<3.0.0,>=2.0.0",
    "owlmixin<8.0.0,>=7.0.1",
    "owcli<1.0.0,>=0.8.0",
    "deepdiff==8.6.2",
    "markupsafe==2.0.1",
    "urllib3<3,>=2.8.0",
    "jinja2<4.0.0,>=3.1.2",
    # eMudhraの危殆化したルート証明書 (emSign ECC Root CA - G3) を信頼しない版
    "certifi>=2026.10.19",
]
name = "jumeaux"
version = "6.1.8"
description = "Check difference between two responses of API."
readme = "README.md"
keywords = [
    "diff rest api response regression test",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
]

[project.urls]
homepage = "https://tadashi-aikawa.github.io/jumeaux"
repository = "https://github.com/tadashi-aikawa/jumeaux/blob/master/README.md"
documentation = "https://tadashi-aikawa.github.io/jumeaux"

[project.scripts]
jumeaux = "jumeaux.main:main"

[dependency-groups]
dev = [
    "mkdocs<2.0.0,>=1.5.3",
    "mkdocs-material<10.0.0,>=9.4.6",
    "ruff<1.0.0,>=0.3.7",
    "pytest>=7.2.0,<10.0.0",
    "freezegun<2.0.0,>=1.5.1",
    # https://github.com/aio-libs/aiohttp/issues/7739
    "aiohttp<4.0.0,>=3.10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
# ruff 0.16で既定のルールが大幅に増えたため、それ以前の既定 (E4, E7, E9, F) を明示して据え置く
select = ["E4", "E7", "E9", "F"]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# ここのインポート順を変えると動かなくなるので...
"main.py" = ["E402"]
